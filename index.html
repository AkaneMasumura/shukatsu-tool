<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>就活スケジュール管理ツール</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .done-row {
            background-color: #f3f4f6;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <header class="mb-8 text-center sm:text-left sm:flex sm:justify-between sm:items-center border-b border-slate-200 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">就活管理ツール</h1>
                <p class="text-slate-500 mt-1">選考状況やESの締め切りをスッキリ一元管理</p>
            </div>
            
            <div class="mt-4 sm:mt-0 flex items-center justify-center sm:justify-end gap-2 bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                <label for="userNameInput" class="text-xs font-bold text-slate-500 uppercase tracking-wider">利用者の名前:</label>
                <input type="text" id="userNameInput" placeholder="お名前を入力" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-36">
                <button id="userSwitchBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg shadow-sm transition-colors cursor-pointer">切替/読込</button>
            </div>
        </header>

        <div class="mb-6 flex flex-wrap items-center justify-between gap-4 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-md">
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
                <span class="text-sm font-medium text-slate-300">現在のデータ空間:</span>
                <span id="currentUserName" class="text-base font-bold text-emerald-400">共通</span>
            </div>
            <div id="statusMessage" class="text-sm text-slate-300 font-medium"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-6">
                    <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                        <span>🏢</span> 企業情報の登録・編集
                    </h2>
                    
                    <form id="companyForm" class="space-y-4">
                        <input type="hidden" id="editIndex">
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">企業名 <span class="text-rose-500">*</span></label>
                            <input type="text" id="compName" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">企業HP URL</label>
                                <input type="url" id="compHp" placeholder="https://..." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">マイページURL</label>
                                <input type="url" id="mypageUrl" placeholder="https://..." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">マイページID</label>
                            <input type="text" id="mypageId" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">ES提出期限</label>
                                <input type="date" id="esDeadline" class="w-full border border-slate-300 rounded-xl px-2 py-1 text-sm bg-white">
                            </div>
                            <div class="flex items-center pt-5 pl-2">
                                <input type="checkbox" id="esDone" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                                <label for="esDone" class="ml-2 text-sm font-semibold text-slate-700 select-none">ES提出済み</label>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">次回日程の種類</label>
                                <select id="nextDateType" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                                    <option value="">なし</option>
                                    <option value="説明会">説明会</option>
                                    <option value="面接">面接</option>
                                    <option value="面談">面談</option>
                                    <option value="GD">GD</option>
                                    <option value="SPI/テスト">SPI/テスト</option>
                                    <option value="その他">その他</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">次回日程日時</label>
                                <input type="datetime-local" id="interviewDate" class="w-full border border-slate-300 rounded-xl px-2 py-1.5 text-sm">
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">選考ステータス</label>
                                <select id="compStatus" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                                    <option value="未エントリー">未エントリー</option>
                                    <option value="エントリー済み">エントリー済み</option>
                                    <option value="書類選考中">書類選考中</option>
                                    <option value="1次選考中">1次選考中</option>
                                    <option value="2次選考中">2次選考中</option>
                                    <option value="3次選考中">3次選考中</option>
                                    <option value="複数選考中">複数選考中</option>
                                    <option value="面接通過">面接通過</option>
                                    <option value="内々定">内々定</option>
                                    <option value="内定">内定</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">その他ステータス</label>
                                <select id="otherStatus" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                                    <option value="">（なし）</option>
                                    <option value="辞退">辞退</option>
                                    <option value="お祈り">お祈り</option>
                                    <option value="キープ">キープ</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">メモ</label>
                            <textarea id="compMemo" rows="3" placeholder="志望動機、質問されたこと、次回準備など" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        </div>
                        
                        <div class="flex gap-3 pt-2">
                            <button type="submit" id="saveBtn" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 px-4 rounded-xl shadow-sm transition-colors text-sm cursor-pointer">追加する</button>
                            <button type="button" id="cancelBtn" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 px-4 rounded-xl transition-colors text-sm cursor-pointer">取消</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="lg:col-span-2 space-y-6">
                
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                        <div class="text-xs font-bold text-slate-400 uppercase">総エントリー</div>
                        <div id="totalCount" class="text-2xl font-black text-slate-900 mt-1">0</div>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 shadow-sm text-center">
                        <div class="text-xs font-bold text-blue-500 uppercase">選考中</div>
                        <div id="activeCount" class="text-2xl font-black text-blue-700 mt-1">0</div>
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 shadow-sm text-center">
                        <div class="text-xs font-bold text-emerald-500 uppercase">内定 / 内々定</div>
                        <div id="naiteiCount" class="text-2xl font-black text-emerald-700 mt-1">0</div>
                    </div>
                    <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100 shadow-sm text-center">
                        <div class="text-xs font-bold text-rose-400 uppercase">ES未提出</div>
                        <div id="esPendingCount" class="text-2xl font-black text-rose-600 mt-1">0</div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <span>📋</span> エントリー企業一覧
                        </h3>
                        <span id="tableCount" class="text-xs font-bold bg-slate-200 text-slate-600 px-2.5 py-1 rounded-full">0社</span>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 bg-slate-100 text-slate-500 text-xs font-bold uppercase tracking-wider">
                                    <th class="py-3 px-4">企業名</th>
                                    <th class="py-3 px-4">ES状況</th>
                                    <th class="py-3 px-4">次回選考日程</th>
                                    <th class="py-3 px-4">ステータス</th>
                                    <th class="py-3 px-4 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="companyTableBody" class="divide-y divide-slate-100 text-sm">
                                </tbody>
                        </table>
                    </div>
                    
                    <div id="emptyState" class="py-12 text-center text-slate-400 hidden">
                        <p class="text-3xl mb-2">🍃</p>
                        <p class="text-sm font-medium">登録されている企業がありません</p>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script>
        // 【最重要】ここに新しく作ったGoogleのウェブアプリURLを貼り付けてください！
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwn7vwwR_sUhOJOnowLUze9PT5t6HUJz2GCj1yfvrDPC7--tqLrqYsCVWKBXi5YzOdmMQ/exec";

        let companies = [];
        let currentUserName = ""; // 空っぽ＝「共通」

        const companyForm = document.getElementById("companyForm");
        const companyTableBody = document.getElementById("companyTableBody");
        const emptyState = document.getElementById("emptyState");
        const statusMessage = document.getElementById("statusMessage");
        const saveBtn = document.getElementById("saveBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const editIndexInput = document.getElementById("editIndex");

        const userNameInput = document.getElementById("userNameInput");
        const userSwitchBtn = document.getElementById("userSwitchBtn");
        const currentUserNameEl = document.getElementById("currentUserName");

        // ページ読み込み時に実行
        window.addEventListener("load", () => {
            // ローカルストレージにお名前が残っていれば復元
            const savedName = localStorage.getItem("jiukatsu_user_name") || "";
            userNameInput.value = savedName;
            currentUserName = savedName.trim();
            
            fetchData();
        });

        // ユーザー切り替えボタン
        userSwitchBtn.addEventListener("click", () => {
            const inputName = userNameInput.value.trim();
            localStorage.setItem("jiukatsu_user_name", inputName);
            currentUserName = inputName;
            fetchData();
        });

        // Googleからデータを取得
        function fetchData() {
            showStatus("データを読み込んでいます...");
            currentUserNameEl.textContent = currentUserName || "共通";
            
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                method: "POST",
                body: JSON.stringify({ action: "load", userName: currentUserName })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    companies = res.data.companies || [];
                    renderTable();
                    showStatus("同期完了", true);
                } else {
                    showStatus("通信エラーが発生しました。");
                }
            })
            .catch(err => {
                console.error(err);
                showStatus("通信エラーが発生しました。");
            });
        }

        // Googleにデータを保存
        function saveAllData() {
            showStatus("データを保存中...");
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "save", userName: currentUserName, data: companies })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    showStatus("変更を保存しました", true);
                } else {
                    showStatus("保存エラーが発生しました。");
                }
            })
            .catch(err => {
                console.error(err);
                showStatus("保存エラーが発生しました。");
            });
        }

        // 状態メッセージ表示
        function showStatus(msg, isSuccess = false) {
            statusMessage.textContent = msg;
            if (isSuccess) {
                statusMessage.className = "text-sm text-emerald-400 font-bold";
                setTimeout(() => {
                    if (statusMessage.textContent === "変更を保存しました" || statusMessage.textContent === "同期完了") {
                        statusMessage.textContent = "同期中 (安定)";
                        statusMessage.className = "text-sm text-slate-400 font-medium";
                    }
                }, 3000);
            } else if (msg.includes("エラー")) {
                statusMessage.className = "text-sm text-rose-400 font-bold animate-bounce";
            } else {
                statusMessage.className = "text-sm text-amber-400 font-medium";
            }
        }

        // 表の描画
        function renderTable() {
            companyTableBody.innerHTML = "";
            
            if (companies.length === 0) {
                emptyState.classList.remove("hidden");
                updateCounters();
                document.getElementById("tableCount").textContent = "0社";
                return;
            }
            emptyState.classList.add("hidden");

            companies.forEach((comp, index) => {
                const tr = document.createElement("tr");
                if (comp.esDone && (comp.status === "内定" || comp.status === "内々定" || comp.otherStatus)) {
                    tr.className = "done-row border-b border-slate-100 hover:bg-slate-50 transition-colors";
                } else {
                    tr.className = "border-b border-slate-100 hover:bg-slate-50 transition-colors";
                }

                // 企業名（リンク付き）
                const nameCell = comp.hp 
                    ? `<a href="${comp.hp}" target="_blank" class="text-blue-600 font-bold hover:underline">${comp.name}</a>`
                    : `<span class="font-bold text-slate-900">${comp.name}</span>`;

                // ESバッジ
                let esBadge = "";
                if (comp.esDone) {
                    esBadge = `<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-semibold">提出済</span>`;
                } else if (comp.esDeadline) {
                    const today = new Date().toISOString().split('T')[0];
                    const isUrgent = comp.esDeadline <= today;
                    const badgeClass = isUrgent ? "bg-rose-100 text-rose-700 animate-pulse" : "bg-amber-100 text-amber-700";
                    esBadge = `<div class="space-y-1">
                        <span class="${badgeClass} text-xs px-2 py-0.5 rounded-full font-semibold">未提出</span>
                        <div class="text-[11px] text-slate-400 font-medium">${comp.esDeadline} 締切</div>
                    </div>`;
                } else {
                    esBadge = `<span class="bg-slate-100 text-slate-400 text-xs px-2 py-0.5 rounded-full">未設定</span>`;
                }

                // 次回選考
                let interviewText = `<span class="text-slate-400">-</span>`;
                if (comp.nextDateType || comp.interviewDate) {
                    const typeText = comp.nextDateType ? `[${comp.nextDateType}] ` : "";
                    const dateText = comp.interviewDate ? comp.interviewDate.replace("T", " ") : "日時未定";
                    interviewText = `<div class="text-xs font-medium text-slate-700">
                        <span class="text-indigo-600 font-bold">${typeText}</span>${dateText}
                    </div>`;
                }

                // ステータスバッジ
                let statusClass = "bg-slate-100 text-slate-600";
                if (comp.status.includes("内定") || comp.status.includes("内々定")) statusClass = "bg-emerald-600 text-white font-bold";
                else if (comp.status.includes("選考中")) statusClass = "bg-blue-100 text-blue-700 font-semibold";
                else if (comp.status.includes("エントリー")) statusClass = "bg-purple-100 text-purple-700";

                let statusHtml = `<span class="${statusClass} text-xs px-2.5 py-1 rounded-lg">${comp.status}</span>`;
                if (comp.otherStatus) {
                    let otherClass = "bg-slate-500 text-white";
                    if (comp.otherStatus === "お祈り") otherClass = "bg-slate-400 text-white";
                    if (comp.otherStatus === "辞退") otherClass = "bg-zinc-400 text-white";
                    statusHtml += ` <span class="${otherClass} text-xs px-2 py-0.5 rounded-md ml-1">${comp.otherStatus}</span>`;
                }

                // マイページボタン
                const mypageBtn = comp.mypageUrl
                    ? `<a href="${comp.mypageUrl}" target="_blank" title="マイページを開く (ID: ${comp.mypageId || '未登録'})" class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 shadow-sm">🔑</a>`
                    : `<button disabled class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-100 bg-slate-50 text-slate-300 opacity-50">🔑</button>`;

                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium">${nameCell}</td>
                    <td class="py-3 px-4">${esBadge}</td>
                    <td class="py-3 px-4">${interviewText}</td>
                    <td class="py-3 px-4">${statusHtml}</td>
                    <td class="py-3 px-4 text-center">
                        <div class="flex items-center justify-center gap-1.5">
                            ${mypageBtn}
                            <button onclick="editCompany(${index})" class="w-8 h-8 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 shadow-sm cursor-pointer" title="編集">✏️</button>
                            <button onclick="deleteCompany(${index})" class="w-8 h-8 rounded-lg border border-rose-100 bg-rose-50 hover:bg-rose-100 text-rose-600 shadow-sm cursor-pointer" title="削除">🗑️</button>
                        </div>
                    </td>
                `;
                companyTableBody.appendChild(tr);
            });

            updateCounters();
            document.getElementById("tableCount").textContent = `${companies.length}社`;
        }

        // カウンター更新
        function updateCounters() {
            let total = companies.length;
            let active = 0;
            let naitei = 0;
            let esPending = 0;

            companies.forEach(comp => {
                if (comp.status === "内定" || comp.status === "内々定") naitei++;
                if (!comp.esDone && comp.esDeadline) esPending++;
                if (!comp.otherStatus && !comp.status.includes("内定") && comp.status !== "未エントリー") active++;
            });

            document.getElementById("totalCount").textContent = total;
            document.getElementById("activeCount").textContent = active;
            document.getElementById("naiteiCount").textContent = naitei;
            document.getElementById("esPendingCount").textContent = esPending;
        }

        // フォーム送信（追加・編集）
        companyForm.addEventListener("submit", (e) => {
            e.preventDefault();
            
            const index = editIndexInput.value;
            const companyData = {
                name: document.getElementById("compName").value.trim(),
                hp: document.getElementById("compHp").value.trim(),
                mypageUrl: document.getElementById("mypageUrl").value.trim(),
                mypageId: document.getElementById("mypageId").value.drop || document.getElementById("mypageId").value.trim(),
                esDeadline: document.getElementById("esDeadline").value,
                esDone: document.getElementById("esDone").checked,
                nextDateType: document.getElementById("nextDateType").value,
                interviewDate: document.getElementById("interviewDate").value,
                status: document.getElementById("compStatus").value,
                otherStatus: document.getElementById("otherStatus").value,
                memo: document.getElementById("compMemo").value.trim()
            };

            if (index === "") {
                companies.push(companyData);
            } else {
                companies[index] = companyData;
                resetForm();
            }

            renderTable();
            saveAllData();
            companyForm.reset();
        });

        // 編集モード
        window.editCompany = function(index) {
            const comp = companies[index];
            editIndexInput.value = index;
            
            document.getElementById("compName").value = comp.name;
            document.getElementById("compHp").value = comp.hp;
            document.getElementById("mypageUrl").value = comp.mypageUrl;
            document.getElementById("mypageId").value = comp.mypageId;
            document.getElementById("esDeadline").value = comp.esDeadline;
            document.getElementById("esDone").checked = comp.esDone;
            document.getElementById("nextDateType").value = comp.nextDateType;
            document.getElementById("interviewDate").value = comp.interviewDate;
            document.getElementById("compStatus").value = comp.status;
            document.getElementById("otherStatus").value = comp.otherStatus;
            document.getElementById("compMemo").value = comp.memo;

            saveBtn.textContent = "変更を確定";
            cancelBtn.classList.remove("hidden");
            document.getElementById("compName").focus();
        };

        // 削除機能
        window.deleteCompany = function(index) {
            if (confirm(`本当に「${companies[index].name}」のデータを削除しますか？`)) {
                companies.splice(index, 1);
                renderTable();
                saveAllData();
                if (editIndexInput.value !== "") resetForm();
            }
        };

        // キャンセルボタン
        cancelBtn.addEventListener("click", resetForm);

        function resetForm() {
            editIndexInput.value = "";
            companyForm.reset();
            saveBtn.textContent = "追加する";
            cancelBtn.classList.add("hidden");
        }
    </script>
</body>
</html>
